<!doctype html><html><meta charset="utf-8"><title>Media conversion test</title><button id="run">Run media test</button><pre id="result"></pre><video controls id="preview"></video><script type="module">
import {prepareMedia} from '/media.js';
import {Input,BlobSource,ALL_FORMATS} from '/vendor/mediabunny.mjs';
document.querySelector('#run').onclick=async()=>{
 const result=document.querySelector('#result');result.textContent='Generating portrait video with audio…';
 let context,stream;
 try {
 const canvas=document.createElement('canvas');canvas.width=180;canvas.height=320;
 const ctx=canvas.getContext('2d');stream=canvas.captureStream(20);
 context=new AudioContext();await context.resume();const oscillator=context.createOscillator(),dest=context.createMediaStreamDestination();oscillator.connect(dest);oscillator.start();stream.addTrack(dest.stream.getAudioTracks()[0]);
 const recorder=new MediaRecorder(stream);const chunks=[];recorder.ondataavailable=e=>chunks.push(e.data);
 const stopped=new Promise(r=>recorder.onstop=r);recorder.start();
 for(let i=0;i<30;i++){ctx.fillStyle=i%2?'#abcdef':'#ff99aa';ctx.fillRect(0,0,180,320);await new Promise(r=>setTimeout(r,50));}
 recorder.stop();await stopped;oscillator.stop();stream.getTracks().forEach(t=>t.stop());await context.close();
 const original=new File(chunks,'phone.mov',{type:recorder.mimeType});
 const file=await prepareMedia(original,{onProgress:p=>result.textContent=p});
 const input=new Input({source:new BlobSource(file),formats:ALL_FORMATS});
 const video=await input.getPrimaryVideoTrack(),audio=await input.getPrimaryAudioTrack(),duration=await input.computeDuration();
 if(!video||!audio||video.displayWidth>=video.displayHeight||duration<1)throw new Error('Lost video, audio, orientation or duration');
 input.dispose();document.querySelector('#preview').src=URL.createObjectURL(file);
 const controller=new AbortController();controller.abort();let aborted=false;try{await prepareMedia(original,{signal:controller.signal});}catch(e){aborted=e.name==='AbortError';}if(!aborted)throw new Error('Cancellation failed');
 result.textContent=`PASS: portrait ${video.displayWidth}x${video.displayHeight}, audio retained, ${duration.toFixed(2)} seconds, ${file.type}, ${file.size} bytes, cancellation.`;
 }catch(e){result.textContent='FAIL: '+e.message;stream?.getTracks().forEach(t=>t.stop());if(context?.state!=='closed')await context?.close();}
};</script></html>
